services:
  - type: web
    name: vier-agent
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WS_PORT
        value: 8080
      - key: COSTON2_RPC
        value: https://coston2-api.flare.network/ext/C/rpc
      - key: INVOICE_NFT_ADDRESS
        value: 0x457310fA90dd419c86B09F4BDb97168A62e2370a
      - key: YIELD_VAULT_ADDRESS
        value: 0x6A5aaba21Ae401BeC7d60F076127d0F6AB46D43d
      - key: AGENT_ROUTER_ADDRESS
        value: 0x98DbA1d179b013342C2f63Ef551Cf72de4bb64e3
      - key: PYTH_ORACLE_ADDRESS
        value: 0x7CfdF0580C87d0c379c4a5cDbC46A036E8AF71E3
      - key: AGENT_PRIVATE_KEY
        sync: false  # Will be set via Render dashboard (sensitive)
      - key: QWEN_API_KEY
        sync: false  # Will be set via Render dashboard (sensitive)
