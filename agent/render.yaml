services:
  - type: web
    name: vier-agent
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WS_PORT
        value: 8080
      - key: COSTON2_RPC
        value: https://coston2-api.flare.network/ext/C/rpc
      - key: INVOICE_NFT_ADDRESS
        value: 0x7481aeE59C35bb08c4F4B0DC4DE0C0A143c9d7b7
      - key: YIELD_VAULT_ADDRESS
        value: 0xfDa39D8a75391aAec43BB54a774bf6F03A0033b6
      - key: AGENT_ROUTER_ADDRESS
        value: 0x95116249980028E240403477E41dF44e12968AC5
      - key: FTSO_ORACLE_ADDRESS
        value: 0xCc351f611b89607e25ab124D3abF58A83ADf94a9
      - key: FTSO_V2_ADDRESS
        value: 0xC4e9c78EA53db782E28f28Fdf80BaF59336B304d
      - key: AGENT_PRIVATE_KEY
        sync: false  # Will be set via Render dashboard (sensitive)
      - key: QWEN_API_KEY
        sync: false  # Will be set via Render dashboard (sensitive)
